name: Base produits
# Reconstruit data/ depuis l'export complet d'Open Food Facts :
# chaque lundi, à la demande, ou quand tools/ change.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/build_data.py', 'tools/config.json', '.github/workflows/data.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: base-produits
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Installer DuckDB
        run: pip install duckdb==1.1.3
      - name: Construire la base
        run: python3 tools/build_data.py /tmp/off-products.csv.gz
      - name: Publier
        run: |
          git config user.name "rayon-sur-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "Base inchangée"; exit 0; fi
          git commit -q -m "Mettre à jour la base produits ($(date -u +%F))"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
